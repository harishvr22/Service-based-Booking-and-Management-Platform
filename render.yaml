databases:
  - name: apartment_service_db
    databaseName: apartment_service_system
    user: postgres
    plan: free

services:
  # Flask Backend Web Service
  - type: web
    name: apartment-service-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend --worker-class eventlet -w 1 app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: apartment_service_db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: MAIL_DEFAULT_SENDER
        value: kit27.am22@gmail.com
      - key: MAIL_PASSWORD
        value: myitunhvvburfavs

  # Vanilla JavaScript Frontend Static Site
  - type: web
    name: apartment-service-frontend
    env: static
    plan: free
    publishPath: frontend
