<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ServiceBook – Job History</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/Resident.css" />
  <link rel="stylesheet" href="../css/servicerequests.css" />
</head>
<body class="dark-theme">

  <div class="dashboard-wrapper">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <h2 style="color: var(--orange);">ServiceBook</h2>
        <p style="font-size: 10px; letter-spacing: 2px; color: #a0a0a0; margin-top: -5px; font-weight: 600;">PROVIDER PORTAL</p>
      </div>
      <div class="menu-section">
        <p class="menu-title">WORKSPACE</p>
        <nav class="sidebar-nav">
          <ul>
            <li>
              <a href="ProviderDashboard.html"><i class="fas fa-th-large"></i> OVERVIEW</a>
            </li>
            <li>
              <a href="ServiceRequests.html"><i class="fas fa-clipboard-list"></i> REQUESTS</a>
            </li>
            <li class="active">
              <a href="JobHistory.html"><i class="fas fa-history"></i> HISTORY</a>
            </li>
            <li>
              <a href="ProviderProfile.html"><i class="far fa-user"></i> PROFILE</a>
            </li>
            <li>
              <a href="provider_support.html"><i class="fas fa-headset"></i> SUPPORT</a>
            </li>
          </ul>
        </nav>
      </div>
      <div class="logout-section">
        <a href="landingpage.html" class="logout-btn"><i class="fas fa-sign-out-alt"></i> LOGOUT</a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Top Navbar -->
      <header class="top-nav">
        <div class="nav-left">
          <i class="fas fa-columns" style="color: #888;"></i>
          <span><span style="color: #888; font-size: 12px; font-weight: 600; letter-spacing: 1px;">PROVIDER</span> &nbsp;/&nbsp; History</span>
        </div>
        <div class="nav-right" style="display: flex; align-items: center; gap: 15px;">
          <div style="background: rgba(46,204,113,0.1); border: 1px solid #2ecc71; color: #2ecc71; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px;">
            <div style="width: 6px; height: 6px; background: #2ecc71; border-radius: 50%;"></div> Online
          </div>
          <a href="provider_notifications.html" class="nav-icon-btn" style="position: relative;">
            <i class="far fa-bell"></i>
          </a>
          <div class="user-profile">
            <div class="avatar" style="background: var(--orange); color: black; font-weight: bold; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%;">AV</div>
          </div>
        </div>
      </header>

      <!-- Dashboard Body -->
      <div class="dashboard-body">

        <!-- Page Header -->
        <section style="margin-bottom: 30px;">
          <p style="color: var(--orange); letter-spacing: 2px; font-size: 12px; font-weight: 600; margin-bottom: 5px;">RECORDS</p>
          <h1 style="font-size: 32px; font-weight: 700; margin-bottom: 8px; color: white;">Job History</h1>
          <p style="color: #9e9e9e; font-size: 14px;">Review all your completed and cancelled service jobs.</p>
        </section>

        <!-- Search Bar -->
        <div class="sr-toolbar">
          <div class="sr-search-wrap">
            <i class="fas fa-search sr-search-icon"></i>
            <input type="text" id="sr-search" class="sr-search" placeholder="Search history..." />
          </div>
        </div>

        <!-- History List -->
        <div class="sr-requests-list" id="history-list">
          <!-- Cards rendered by JS -->
          <div style="text-align:center; padding: 40px; color: #888;">Fetching history...</div>
        </div>
      </div>
    </main>
  </div>

  <script src="../javascript/config.js"></script>
  <script src="../javascript/jobhistory.js"></script>
  <script src="../javascript/header.js"></script>
</body>
</html>
