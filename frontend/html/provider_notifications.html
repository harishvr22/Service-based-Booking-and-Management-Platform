<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApartmentCare - Service Provider Portal</title>
    <link rel="stylesheet" href="../css/providerdashboard.css">
    <link rel="stylesheet" href="../css/notifications.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/theme.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </div>
                <div class="logo-text">
                    <h3>ApartmentCare</h3>
                    <p>Service Provider Portal</p>
                </div>
            </div>
            <div class="header-right" style="display: flex; align-items: center; gap: 15px;">
                <a href="provider_notifications.html" class="nav-icon-btn" style="position: relative; color: var(--orange, #ff8c00); text-decoration: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 20px; height: 20px;">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span class="badge" style="position: absolute; top: -5px; right: -5px; background: var(--orange, #ff8c00); color: black; border-radius: 50%; padding: 2px 5px; font-size: 10px; font-weight: bold; display: none;">0</span>
                </a>
                <a href="landingpage.html" class="logout-btn">Logout</a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <div class="page-title-section notif-header" style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;">
          <div>
            <h1 style="color: white; margin-bottom: 5px;">Notifications</h1>
            <p style="color: #9e9e9e;">Stay updated on your requests and assignments.</p>
          </div>
          <button class="mark-read-btn" style="background: none; border: none; color: #ff8c00; cursor: pointer; font-weight: 600;">Mark all as read</button>
        </div>

        <div class="notifications-wrapper">
          <div class="notification-list">
            
            <!-- Notification Item -->
            <div class="notification-item unread">
              <div class="notif-icon-wrapper orange-bg">
                <i class="far fa-bell"></i>
              </div>
              <div class="notif-content">
                <h4>New Service Request</h4>
                <p>New plumbing repair assigned to you.</p>
              </div>
              <div class="notif-meta">
                <span class="notif-time">2h ago</span>
                <span class="unread-dot"></span>
              </div>
            </div>

            <!-- Notification Item -->
            <div class="notification-item">
              <div class="notif-icon-wrapper gray-bg">
                <i class="far fa-bell"></i>
              </div>
              <div class="notif-content">
                <h4>Job Marked Complete</h4>
                <p>Resident confirmed plumbing work completion.</p>
              </div>
              <div class="notif-meta">
                <span class="notif-time">3d ago</span>
              </div>
            </div>

          </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="../javascript/notifications.js"></script>
    <script src="../javascript/theme.js"></script>
</body>

</html>
