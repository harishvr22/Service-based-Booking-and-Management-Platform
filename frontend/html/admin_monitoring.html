<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiceBook - Admin Console (Monitoring)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/admin_dark.css">
    <link rel="stylesheet" href="../css/admin_monitoring.css">
</head>
<body class="admin-dark">
<div class="admin-wrapper">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
        <div class="admin-brand">
            <h2>ServiceBook</h2>
            <p>ADMIN CONSOLE</p>
        </div>
        <div class="admin-menu-section">
            <p class="admin-menu-title">MANAGE</p>
            <nav class="admin-nav">
                <ul>
                    <li><a href="admin_dashboard.html"><i class="fas fa-th-large"></i> OVERVIEW</a></li>
                    <li><a href="users.html"><i class="fas fa-users"></i> RESIDENTS</a></li>
                    <li><a href="admin_providers.html"><i class="fas fa-wrench"></i> PROVIDERS</a></li>
                    <li class="active"><a href="admin_monitoring.html"><i class="fas fa-chart-line"></i> MONITORING</a></li>
                    <li><a href="announcements.html"><i class="fas fa-bullhorn"></i> ANNOUNCEMENTS</a></li>
                    <li><a href="admin_roles.html"><i class="fas fa-shield-alt"></i> ADMIN ROLES</a></li>
                    <li><a href="admin_complaints.html"><i class="fas fa-exclamation-triangle"></i> COMPLAINTS</a></li>
                </ul>
            </nav>
        </div>
        <div class="admin-profile">
            <div class="admin-avatar">AR</div>
            <div class="admin-info">
                <div class="name">Alex Reed</div>
                <div class="role">SUPER ADMIN</div>
            </div>
        </div>
        <div class="admin-logout">
            <a href="login.html"><i class="fas fa-sign-out-alt"></i> LOGOUT</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
        <header class="admin-header">
            <div class="admin-header-left">
                <i class="fas fa-columns"></i>
                <span>ADMIN CONSOLE</span> / <span class="admin-header-title">Monitoring</span>
            </div>
            <div class="admin-sys-status">
                <div class="status-dot"></div> SYSTEM ONLINE
            </div>
        </header>

        <div class="admin-body">
            <!-- Stats Grid -->
            <div class="ad-stats-grid">
                <div class="ad-stat-card">
                    <div class="ad-stat-top">
                        <i class="far fa-clock" style="background:rgba(255,140,0,0.1);padding:8px;border-radius:4px;color:var(--orange);"></i>
                        <span class="ad-stat-trend" style="color:var(--orange);">LIVE</span>
                    </div>
                    <div class="ad-stat-val" id="stat-pending">0</div>
                    <div class="ad-stat-label">PENDING</div>
                </div>
                <div class="ad-stat-card">
                    <div class="ad-stat-top">
                        <i class="fas fa-bolt" style="background:rgba(255,140,0,0.1);padding:8px;border-radius:4px;color:var(--orange);"></i>
                        <span class="ad-stat-trend" style="color:var(--orange);">LIVE</span>
                    </div>
                    <div class="ad-stat-val" id="stat-inprogress">0</div>
                    <div class="ad-stat-label">IN PROGRESS</div>
                </div>
                <div class="ad-stat-card">
                    <div class="ad-stat-top">
                        <i class="far fa-check-circle" style="background:rgba(255,140,0,0.1);padding:8px;border-radius:4px;color:var(--orange);"></i>
                        <span class="ad-stat-trend" style="color:var(--orange);">LIVE</span>
                    </div>
                    <div class="ad-stat-val" id="stat-completed">0</div>
                    <div class="ad-stat-label">COMPLETED</div>
                </div>
                <div class="ad-stat-card">
                    <div class="ad-stat-top">
                        <i class="far fa-times-circle" style="background:rgba(255,140,0,0.1);padding:8px;border-radius:4px;color:var(--orange);"></i>
                        <span class="ad-stat-trend" style="color:var(--orange);">LIVE</span>
                    </div>
                    <div class="ad-stat-val" id="stat-cancelled">0</div>
                    <div class="ad-stat-label">CANCELLED</div>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="monitor-toolbar">
                <input id="search-input" class="monitor-search" type="text" placeholder="&#xf002;  Search by service, resident, or provider..." />
                <select id="filter-status" class="monitor-filter">
                    <option value="">All Statuses</option>
                    <option value="pending">Pending</option>
                    <option value="approved">Approved</option>
                    <option value="in-progress">In Progress</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
                <select id="filter-service" class="monitor-filter">
                    <option value="">All Services</option>
                    <option value="Plumbing">Plumbing</option>
                    <option value="Cleaning">Cleaning</option>
                    <option value="Electrical">Electrical</option>
                    <option value="Carpentry">Carpentry</option>
                </select>
                <button class="btn-refresh" id="btn-refresh" onclick="handleRefresh()">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>

            <!-- Tabs -->
            <div class="monitor-tabs">
                <button class="monitor-tab active" id="tab-ongoing" onclick="switchTab('ongoing')">ONGOING</button>
                <button class="monitor-tab" id="tab-completed" onclick="switchTab('completed')">COMPLETED</button>
            </div>

            <!-- Tab Content -->
            <div class="tab-content-area">
                <div class="results-count" id="results-count"></div>
                <div class="monitor-list" id="monitor-list"></div>
            </div>
        </div>
    </main>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detail-modal">
    <div class="modal-box">
        <button class="modal-close" onclick="closeModal('detail-modal')">&times;</button>
        <div class="modal-title" id="modal-service-name"></div>
        <div class="modal-sub" id="modal-booking-id"></div>
        <div id="modal-rows"></div>
        <div class="modal-actions" id="modal-action-btns"></div>
    </div>
</div>

<!-- Confirm Modal -->
<div class="modal-overlay" id="confirm-modal">
    <div class="confirm-box">
        <div class="confirm-icon" id="confirm-icon"></div>
        <div class="confirm-title" id="confirm-title"></div>
        <div class="confirm-msg" id="confirm-msg"></div>
        <div class="confirm-actions">
            <button class="btn-confirm-cancel" onclick="closeModal('confirm-modal')">Keep It</button>
            <button class="btn-confirm-ok" id="confirm-ok-btn">Confirm</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
    <i class="fas fa-check-circle" id="toast-icon"></i>
    <span id="toast-msg"></span>
</div>

<script src="../javascript/admin_monitoring.js"></script>
</body>
</html>
