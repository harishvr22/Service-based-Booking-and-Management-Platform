<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ServiceBook – My Bookings</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/Resident.css" />
  <link rel="stylesheet" href="../css/mybookings.css" />
</head>
<body class="dark-theme">

  <div class="dashboard-wrapper">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <h2>ServiceBook</h2>
      </div>
      <div class="menu-section">
        <p class="menu-title">MENU</p>
        <nav class="sidebar-nav">
          <ul>
            <li>
              <a href="ResidentDashboard.html"><i class="fas fa-th-large"></i> Overview</a>
            </li>
            <li>
              <a href="servicebooking.html"><i class="fas fa-wrench"></i> Services</a>
            </li>
            <li class="active">
              <a href="mybookings.html"><i class="far fa-calendar-alt"></i> Bookings</a>
            </li>
            <li>
              <a href="ResidentProfile.html"><i class="far fa-user"></i> Profile</a>
            </li>
          </ul>
        </nav>
      </div>
      
      <div class="logout-section">
        <a href="#" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Top Navbar -->
      <header class="top-nav">
        <div class="nav-left">
          <i class="far fa-window-maximize"></i>
          <span>Bookings</span>
        </div>
        <div class="nav-right">
          <a href="notifications.html" class="nav-icon-btn"><i class="far fa-bell"></i></a>
          <div class="user-profile">
            <div class="avatar user-initial">A</div>
            <div class="user-details">
              <span class="user-name">Guest</span>
              <span class="user-role">Resident</span>
            </div>
          </div>
        </div>
      </header>

      <!-- Dashboard Body -->
      <div class="dashboard-body">
        
        <!-- Header -->
        <div class="page-title-section">
          <h1>My Bookings</h1>
          <p>Track all your service requests in one place.</p>
        </div>

        <div class="bookings-wrapper">
          <!-- Filter Tabs -->
          <div class="filter-tabs">
            <button class="filter-tab active">ALL</button>
            <button class="filter-tab">PENDING</button>
            <button class="filter-tab">APPROVED</button>
            <button class="filter-tab">COMPLETED</button>
          </div>

          <!-- Clear History Button -->
          <div id="clearButtonContainer" style="display: none; margin-bottom: 20px;">
            <button class="btn-clear-history" onclick="clearHistory()">🗑️ Clear History</button>
          </div>
          
          <!-- Bookings will be loaded here -->
          <div id="bookingsList" class="booking-list"></div>

          <!-- Empty state -->
          <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-icon">📭</div>
            <h2>No bookings placed</h2>
            <p>You haven't booked any services yet. Start by booking a service.</p>
            <a href="servicebooking.html" class="btn-primary" style="display:inline-block; padding: 12px 24px;">Book a Service</a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../javascript/mybookings.js"></script>
  <script src="../javascript/header.js"></script>
</body>
</html>
