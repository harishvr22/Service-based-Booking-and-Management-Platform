<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiceBook - Admin Console (Complaints)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/admin_dark.css">
    <link rel="stylesheet" href="../css/admin_complaints.css">
</head>
<body class="admin-dark">
    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-brand">
                <h2>ServiceBook</h2>
                <p>ADMIN CONSOLE</p>
            </div>
            
            <div class="admin-menu-section">
                <p class="admin-menu-title">MANAGE</p>
                <nav class="admin-nav">
                    <ul>
                        <li><a href="admin_dashboard.html"><i class="fas fa-th-large"></i> OVERVIEW</a></li>
                        <li><a href="users.html"><i class="fas fa-users"></i> RESIDENT</a></li>
                        <li><a href="admin_providers.html"><i class="fas fa-wrench"></i> PROVIDERS</a></li>
                        <li><a href="admin_monitoring.html"><i class="fas fa-chart-line"></i> MONITORING</a></li>
                        <li><a href="admin_roles.html"><i class="fas fa-shield-alt"></i> ADMIN ROLES</a></li>
                        <li><a href="announcements.html"><i class="fas fa-bullhorn"></i> ANNOUNCEMENTS</a></li>
                        <li class="active"><a href="admin_complaints.html"><i class="fas fa-exclamation-triangle"></i> COMPLAINTS</a></li>
                    </ul>
                </nav>
            </div>
            
            <a href="admin_profile.html" style="text-decoration: none; display: block;">
            
            <div class="admin-profile" style="background: rgba(255,255,255,0.05); border: 1px solid var(--orange);">
                <div class="admin-avatar">AR</div>
                <div class="admin-info">
                    <div class="name">Alex Reed</div>
                    <div class="role">SUPER ADMIN</div>
                </div>
            </div>
            
            </a>

            <div class="admin-logout">
                <a href="login.html"><i class="fas fa-sign-out-alt"></i> LOGOUT</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <!-- Header -->
            <header class="admin-header">
                <div class="admin-header-left">
                    <i class="fas fa-columns"></i>
                    <span>ADMIN CONSOLE</span> / <span class="admin-header-title">Complaints</span>
                </div>
                <div style="display: flex; align-items: center; gap: 20px;">
                    <button id="clearAllBtn" style="background: rgba(231, 76, 60, 0.1); color: #e74c3c; border: 1px solid rgba(231, 76, 60, 0.3); padding: 8px 16px; border-radius: 4px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s;"><i class="fas fa-trash-alt" style="margin-right: 6px;"></i> CLEAR ALL COMPLAINTS</button>
                    <div class="admin-sys-status">
                        <div class="status-dot"></div> SYSTEM ONLINE
                    </div>
                </div>
            </header>

            <div class="admin-body">
                <!-- Complaint Items -->
                <div class="complaint-list" id="complaintsContainer">
                    <!-- Complaint items will be dynamically generated here -->
                </div>

            </div>
        </main>
    </div>

    <!-- ── Message User Modal ── -->
    <div class="modal-overlay" id="messageModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="far fa-envelope text-orange"></i> Send Message</h3>
                <div class="btn-close-modal" id="closeMsgModal"><i class="fas fa-times"></i></div>
            </div>
            <div class="modal-body">
                <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">Sending message to <strong id="msgTargetName" style="color: #fff;">User</strong></p>
                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 1px;">SUBJECT</label>
                    <input type="text" id="msgSubject" placeholder="e.g. Complaint Resolution" style="width: 100%; background: #1a1a1a; border: 1px solid var(--border-color); color: #fff; padding: 12px; border-radius: 4px; outline: none;">
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 1px;">MESSAGE CONTENT</label>
                    <textarea id="msgContent" rows="5" placeholder="Type your message here..." style="width: 100%; background: #1a1a1a; border: 1px solid var(--border-color); color: #fff; padding: 12px; border-radius: 4px; outline: none; resize: vertical;"></textarea>
                </div>
            </div>
            <div class="modal-footer" style="display: flex; gap: 12px; padding-top: 10px; border-top: 1px solid var(--border-color);">
                <button id="cancelMsgBtn" style="flex: 1; background: transparent; border: 1px solid var(--border-color); color: #fff; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: 600;">CANCEL</button>
                <button id="sendMsgBtn" style="flex: 1; background: var(--orange); border: none; color: #000; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: 700;"><i class="fas fa-paper-plane" style="margin-right: 6px;"></i> SEND NOTIFICATION</button>
            </div>
        </div>
    </div>

    <!-- ── Custom Alert Modal ── -->
    <div id="alertModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; align-items: center; justify-content: center; backdrop-filter: blur(4px);">
        <div style="background: #1c1c1c; border: 1px solid #2a2a2a; border-radius: 16px; padding: 30px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
            <div id="alertIcon" style="font-size: 48px; margin-bottom: 20px;"></div>
            <h3 id="alertTitle" style="color: white; margin-bottom: 10px;">Success!</h3>
            <p id="alertMessage" style="color: #888; font-size: 14px; line-height: 1.5;"></p>
            <button onclick="closeAlert()" style="margin-top: 25px; width: 100%; padding: 12px; background: var(--orange); border: none; border-radius: 8px; font-weight: 700; cursor: pointer; color: black;">OK</button>
        </div>
    </div>

    <!-- ── Custom Confirm Modal ── -->
    <div id="confirmModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; align-items: center; justify-content: center; backdrop-filter: blur(4px);">
        <div style="background: #1c1c1c; border: 1px solid #2a2a2a; border-radius: 16px; padding: 30px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
            <div style="font-size: 48px; margin-bottom: 20px; color: var(--orange);"><i class="fas fa-question-circle"></i></div>
            <h3 id="confirmTitle" style="color: white; margin-bottom: 10px;">Are you sure?</h3>
            <p id="confirmMessage" style="color: #888; font-size: 14px; line-height: 1.5;"></p>
            <div style="display: flex; gap: 15px; margin-top: 25px;">
                <button onclick="closeConfirm(false)" style="flex: 1; padding: 12px; background: transparent; border: 1px solid #2a2a2a; color: white; border-radius: 8px; font-weight: 600; cursor: pointer;">CANCEL</button>
                <button onclick="closeConfirm(true)" style="flex: 1; padding: 12px; background: var(--orange); border: none; color: black; border-radius: 8px; font-weight: 700; cursor: pointer;">CONFIRM</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../javascript/admin_complaints.js"></script>
    <script src="../javascript/admin_common.js"></script>
</body>
</html>
