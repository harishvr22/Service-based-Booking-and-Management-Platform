<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - ApartmentHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/ResidentProfile.css">
</head>

<body>
    <div class="profile-container">
        <!-- Header -->
        <header class="profile-header">
            <div class="header-left">
                <a href="ResidentDashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <div class="icon-box">
                    <i class="fas fa-building-user"></i>
                </div>
                <div class="header-info">
                    <h2>My Profile</h2>
                    <p>Manage your personal details</p>
                </div>
            </div>
            <div class="header-actions">
                <button id="cancelBtn" class="btn secondary" style="display: none; margin-right: 10px;">Cancel</button>
                <button id="editBtn" class="edit-btn">Edit Profile</button>
            </div>
        </header>

        <!-- Avatar Section -->
        <section class="avatar-section">
            <div class="avatar-circle" id="avatarInitials">RS</div>
            <h1 id="profileName">Rahul Sharma</h1>
            <p id="profileEmail">rahul.sharma@email.com</p>
        </section>

        <!-- Personal Information -->
        <div class="profile-card">
            <div class="card-title-row">
                <i class="far fa-user"></i>
                <h3>Personal Information</h3>
            </div>
            <p class="card-subtitle">Your basic personal details</p>

            <div class="form-grid">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="dispName" value="Rahul Sharma" readonly>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="dispEmail" value="rahul.sharma@email.com" readonly>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-phone-alt"></i> Phone Number</label>
                    <input type="text" id="dispPhone" value="+91 98765 43210" readonly>
                </div>
            </div>
        </div>

        <!-- Apartment Details -->
        <div class="profile-card">
            <div class="card-title-row">
                <i class="fas fa-house-chimney"></i>
                <h3>Apartment Details</h3>
            </div>
            <p class="card-subtitle">Your flat and block information</p>

            <div class="form-grid">
                <div class="form-group">
                    <label>Flat Number</label>
                    <input type="text" id="dispFlat" value="A-302" readonly>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-location-dot"></i> Block</label>
                    <input type="text" id="dispBlock" value="A Block" readonly>
                </div>
                <div class="form-group">
                    <label><i class="far fa-calendar"></i> Move-in Date</label>
                    <input type="text" id="dispMoveIn" value="15-01-2024" readonly>
                </div>
            </div>
        </div>

        <!-- Emergency Contact -->
        <div class="profile-card">
            <div class="card-title-row">
                <i class="fas fa-phone-volume"></i>
                <h3>Emergency Contact</h3>
            </div>
            <p class="card-subtitle">Contact person in case of emergency</p>

            <div class="form-grid">
                <div class="form-group">
                    <label>Contact Name</label>
                    <input type="text" id="dispEmergencyName" value="Not set" readonly>
                </div>
                <div class="form-group">
                    <label>Contact Phone</label>
                    <input type="text" id="dispEmergencyPhone" value="Not set" readonly>
                </div>
            </div>
        </div>
    </div>

    <script src="../javascript/resident_profile.js"></script>
</body>

</html>
