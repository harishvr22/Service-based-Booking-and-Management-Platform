<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Book Service</title>
  <link rel="stylesheet" href="../css/servicebooking.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/theme.css">
</head>
<body>

  <!-- Header -->
  <header class="navbar">
    <div class="left">
      <a href="#" class="back" onclick="goBack(event)">â†</a>
      <div class="logo">
        <div class="logo-icon">ðŸ¢</div>
        <div>
          <h3>Book Service</h3>
          <p>Schedule a service appointment</p>
        </div>
      </div>
    </div>
    <div class="header-right">
      <div class="user-name welcome">Welcome, Guest</div>
      <a href="#" class="logout logout-btn">Logout</a>
    </div>
  </header>

  <!-- Main -->
  <main class="container">
    <div class="card">

      <!-- Selected Service Display -->
      <div class="section service-display">
        <label><i data-lucide="wrench"></i> Selected Service</label>
        <div class="selected-service" id="selectedService">Loading...</div>
      </div>

      <!-- Apartment ID -->
      <div class="section">
        <label><i data-lucide="home"></i> Apartment ID</label>
        <input type="text" placeholder="Enter your apartment ID" />
      </div>

      <!-- Contact Number -->
      <div class="section">
        <label><i data-lucide="phone"></i> Contact Number</label>
        <input type="tel" placeholder="Enter your contact number" />
      </div>

      <!-- Calendar -->
      <div class="section">
        <label><i data-lucide="calendar"></i> Select Date</label>

        <div class="calendar">
          <div class="cal-header">
            <button>â€¹</button>
            <span>February 2026</span>
            <button>â€º</button>
          </div>

          <div class="days">
            <span>Su</span><span>Mo</span><span>Tu</span><span>We</span>
            <span>Th</span><span>Fr</span><span>Sa</span>
          </div>

          <div class="dates">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span class="selected">7</span>

            <span>8</span><span>9</span><span>10</span><span>11</span>
            <span>12</span><span>13</span><span>14</span>

            <span>15</span><span>16</span><span>17</span><span>18</span>
            <span>19</span><span>20</span><span>21</span>

            <span>22</span><span>23</span><span>24</span><span>25</span>
            <span>26</span><span>27</span><span>28</span>
          </div>
        </div>
      </div>

      <!-- Time -->
      <div class="section">
        <label><i data-lucide="clock"></i> Select Time</label>

        <div class="time-grid">
          <button class="time active">09:00 AM</button>
          <button class="time">10:00 AM</button>
          <button class="time">11:00 AM</button>
          <button class="time">12:00 PM</button>
          <button class="time">01:00 PM</button>
          <button class="time">02:00 PM</button>
          <button class="time">03:00 PM</button>
          <button class="time">04:00 PM</button>
          <button class="time">05:00 PM</button>
        </div>
      </div>

      <!-- Problem Summary -->
      <div class="section">
        <label><i data-lucide="message-square"></i> Problem Summary</label>
        <textarea placeholder="Describe the problem or issue you need help with..."></textarea>
      </div>

      <!-- Submit -->
      <button class="submit">Submit Booking</button>

    </div>
  </main>

    
  <script src="../javascript/servicebook.js"></script>
  <script src="../javascript/header.js"></script>
  <script src="../javascript/theme.js"></script>
</body>
</html>
